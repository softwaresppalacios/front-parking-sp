<section class="panel !overflow-hidden !p-0 shadow-soft">
  <div class="flex flex-col gap-4 border-b border-slate-200 bg-slate-50/70 px-5 py-4 md:flex-row md:items-center md:justify-between">
    <div>
      <small class="font-mono text-[10px] uppercase tracking-[.18em] text-slate-400">Configuracion sede</small>
      <h2 class="mt-1 font-heading text-[30px] leading-none">{{ store.branchConfig().name || 'Parqueadero' }}</h2>
    </div>
    <div class="flex flex-wrap gap-3">
      <a class="ghost inline-flex items-center justify-center px-4" routerLink="../">Volver al menu</a>
      <button (click)="store.saveBranchDetails()" [disabled]="store.savingBranch()">Guardar cambios</button>
    </div>
  </div>
  <div class="grid gap-4 p-5 md:grid-cols-2">
    <label>Nombre del parqueadero<input [(ngModel)]="store.branchConfig().name" (ngModelChange)="store.patchBranch('name', $event)" placeholder="Parqueadero Central"></label>
    <label>NIT<input [(ngModel)]="store.branchConfig().nit" (ngModelChange)="store.patchBranch('nit', $event)" placeholder="900.123.456-7"></label>
    <label>Telefono<input [(ngModel)]="store.branchConfig().phone" (ngModelChange)="store.patchBranch('phone', $event)" placeholder="310 456 7890"></label>
    <label>Direccion<input [(ngModel)]="store.branchConfig().address" (ngModelChange)="store.patchBranch('address', $event)" placeholder="Cra 15 # 93-20"></label>
  </div>
</section>

<p class="notice" *ngIf="store.branchMessage()">{{ store.branchMessage() }}</p>
