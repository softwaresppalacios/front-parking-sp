<section class="panel !overflow-hidden !p-0 shadow-soft">
  <div class="flex flex-col gap-4 border-b border-slate-200 bg-slate-50/70 px-5 py-4 md:flex-row md:items-center md:justify-between">
    <div>
      <small class="font-mono text-[10px] uppercase tracking-[.18em] text-slate-400">Horario de atencion</small>
      <h2 class="mt-1 font-heading text-[30px] leading-none">Disponibilidad semanal</h2>
    </div>
    <div class="flex flex-wrap gap-3">
      <a class="ghost inline-flex items-center justify-center px-4" routerLink="../">Volver al menu</a>
      <button (click)="store.saveSchedule()" [disabled]="store.savingSchedule()">Guardar horario</button>
    </div>
  </div>
  <div class="grid gap-3 p-5">
    <article class="schedule-day-card" *ngFor="let day of store.branchConfig().schedules; let i = index">
      <div class="grid gap-1">
        <strong class="font-heading text-[24px] leading-none text-slate-900">{{ dayLabel(day.dayOfWeek) }}</strong>
        <span class="font-mono text-[11px] uppercase tracking-[.16em] text-slate-400">Horario del dia</span>
      </div>
      <div class="schedule-day-card__status"
        [class.border-red-200]="day.closed"
        [class.bg-red-50]="day.closed"
        [class.border-emerald-200]="!day.closed"
        [class.bg-emerald-50]="!day.closed">
        <div class="grid gap-1">
          <span class="font-mono text-[10px] uppercase tracking-[.14em] text-slate-400">Estado</span>
          <span class="font-heading text-lg leading-none" [class.text-red-600]="day.closed" [class.text-emerald-700]="!day.closed">{{ day.closed ? 'Cerrado' : 'Abierto' }}</span>
        </div>
        <button
          type="button"
          class="schedule-switch"
          [class.schedule-switch--active]="!day.closed"
          [attr.aria-checked]="!day.closed"
          [attr.aria-label]="'Cambiar estado de ' + dayLabel(day.dayOfWeek)"
          role="switch"
          (click)="store.toggleClosed(i, !day.closed)">
          <span class="schedule-switch__track">
            <span class="schedule-switch__thumb"></span>
          </span>
          <span class="schedule-switch__text">{{ day.closed ? 'Cerrado' : 'Abierto' }}</span>
        </button>
      </div>
      <label class="schedule-time-field">
        <span class="font-mono text-[10px] uppercase tracking-[.14em] text-slate-400">Hora apertura</span>
        <input class="!rounded-xl !border-slate-200 !bg-white shadow-sm disabled:!bg-slate-100 disabled:text-slate-400" type="time" [(ngModel)]="day.openTime" [disabled]="day.closed">
      </label>
      <label class="schedule-time-field">
        <span class="font-mono text-[10px] uppercase tracking-[.14em] text-slate-400">Hora cierre</span>
        <input class="!rounded-xl !border-slate-200 !bg-white shadow-sm disabled:!bg-slate-100 disabled:text-slate-400" type="time" [(ngModel)]="day.closeTime" [disabled]="day.closed">
      </label>
    </article>
  </div>
</section>

<p class="notice" *ngIf="store.scheduleMessage()">{{ store.scheduleMessage() }}</p>
