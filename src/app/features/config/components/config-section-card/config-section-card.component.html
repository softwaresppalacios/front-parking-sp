<a class="config-section-card" [routerLink]="route">
  <span class="config-section-card__icon">
    <i [class]="icon"></i>
  </span>
  <span class="config-section-card__tag">{{ tag }}</span>
  <h3>{{ title }}</h3>
  <p>{{ description }}</p>
  <strong>{{ summary }}</strong>
  <span class="config-section-card__cta">Abrir seccion</span>
</a>
