<article
  class="group metric-card">
  <div class="metric-card__accent" [class]="accentBar"></div>
  <div class="metric-card__icon" [class]="iconWrap">
    <span class="metric-card__icon-text">{{ icon }}</span>
  </div>

  <div class="metric-card__content">
    <small class="metric-card__label">{{ label }}</small>
    <p class="metric-card__description">{{ description }}</p>

    <div class="metric-card__value-block">
      <b class="metric-card__value">{{ value }}</b>
      <span class="metric-card__unit">{{ unit }}</span>
    </div>

    <div class="metric-card__footer">
      <span class="metric-card__badge">
        {{ badge }}
      </span>
      <span class="metric-card__meta">Capacidad</span>
    </div>
  </div>
</article>
