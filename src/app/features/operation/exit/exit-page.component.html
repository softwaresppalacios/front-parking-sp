<header class="page-head"><h1>Registrar Salida</h1></header>
<section class="form-panel">
  <label>Buscar placa</label><input [(ngModel)]="plate" (ngModelChange)="onPlateChange($event)" placeholder="ABC123" maxlength="10">
  <button (click)="search()">Buscar vehiculo</button>
  <article class="receipt" *ngIf="found()">
    <h2>{{ found()?.plate }}</h2>
    <p>Entrada: {{ found()?.checkedInAt | date:'short' }}</p>
    <p>Espacio: {{ found()?.spaceCode }}</p>
    <p *ngIf="found()?.keySlotCode || found()?.helmetLockerCode">
      <span *ngIf="found()?.keySlotCode">Llave: {{ found()?.keySlotCode }}</span>
      <span *ngIf="found()?.keySlotCode && found()?.helmetLockerCode"> · </span>
      <span *ngIf="found()?.helmetLockerCode">Casco: {{ found()?.helmetLockerCode }}</span>
    </p>
    <p *ngIf="!found()?.keySlotCode && !found()?.helmetLockerCode">Sin llave/casco</p>
    <b>Total: {{ money(total()) }}</b>
    <select [(ngModel)]="paymentMethod"><option value="CASH">Efectivo</option><option value="DIGITAL">Pago digital</option></select>
    <button (click)="checkOut()">Registrar salida y pago</button>
  </article>
</section>
