# Nginx dentro del contenedor del frontend: sirve la app Angular ya compilada.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas de Angular (/login, /parking/...): siempre responde index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin cache para que cada despliegue se vea de inmediato; los .js/.css llevan hash y si se cachean.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
